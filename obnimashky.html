<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Бар обнімашок</title>
<style>
  :root{
    --bg: #2b2440;
    --bg-2: #3a2f52;
    --plush: #f2c9d8;
    --plush-dim: #6c5b86;
    --amber: #ffb469;
    --cream: #f7ecd9;
    --track: #443a5e;
  }

  *{box-sizing:border-box;}

  html,body{
    margin:0;
    padding:0;
    height:100%;
  }

  body{
    background:
      radial-gradient(circle at 20% 10%, rgba(255,180,105,0.10), transparent 45%),
      radial-gradient(circle at 85% 90%, rgba(242,201,216,0.12), transparent 50%),
      var(--bg);
    color:var(--cream);
    font-family: 'Georgia', 'Iowan Old Style', serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
    overflow-x:hidden;
  }

  .card{
    width:100%;
    max-width:420px;
    background:linear-gradient(180deg, var(--bg-2), var(--bg));
    border:1px solid rgba(242,201,216,0.15);
    border-radius:28px;
    padding:38px 30px 34px;
    box-shadow:0 30px 60px rgba(0,0,0,0.4), inset 0 1px 0 rgba(255,255,255,0.04);
    position:relative;
  }

  .eyebrow{
    font-family: 'Trebuchet MS', sans-serif;
    letter-spacing:0.24em;
    text-transform:uppercase;
    font-size:11px;
    color:var(--plush);
    opacity:0.75;
    text-align:center;
    margin:0 0 6px;
  }

  h1{
    font-size:clamp(26px, 7vw, 32px);
    text-align:center;
    margin:0 0 4px;
    font-weight:400;
    letter-spacing:0.01em;
    color:var(--cream);
  }

  h1 span{
    color:var(--amber);
    font-style:italic;
  }

  .sub{
    text-align:center;
    font-family:'Trebuchet MS', sans-serif;
    font-size:13.5px;
    color:var(--plush-dim);
    margin:0 0 30px;
    line-height:1.5;
  }

  /* Тепло-бар */
  .meter-wrap{
    position:relative;
    margin:0 auto 14px;
  }

  .meter{
    display:flex;
    gap:6px;
    width:100%;
    height:26px;
  }

  .seg{
    flex:1;
    border-radius:7px;
    background:var(--track);
    position:relative;
    overflow:hidden;
    border:1px solid rgba(255,255,255,0.04);
  }

  .seg.filled{
    background:linear-gradient(180deg, #ffcf9c, var(--amber));
    box-shadow:0 0 14px rgba(255,180,105,0.55), inset 0 1px 1px rgba(255,255,255,0.4);
    animation: warm 2.6s ease-in-out infinite;
  }

  .seg.filled:nth-child(2){ animation-delay:0.4s; }

  @keyframes warm{
    0%,100%{ filter:brightness(1); }
    50%{ filter:brightness(1.12); }
  }

  .meter-labels{
    display:flex;
    justify-content:space-between;
    font-family:'Trebuchet MS', sans-serif;
    font-size:11px;
    color:var(--plush-dim);
    margin-top:8px;
  }

  .count{
    text-align:center;
    margin:18px 0 26px;
    font-family:'Trebuchet MS', sans-serif;
  }

  .count b{
    font-family:'Georgia', serif;
    font-size:34px;
    color:var(--amber);
    font-weight:400;
  }

  .count .of{
    font-size:16px;
    color:var(--plush-dim);
  }

  .status{
    background:rgba(242,201,216,0.06);
    border:1px dashed rgba(242,201,216,0.25);
    border-radius:16px;
    padding:16px 18px;
    font-family:'Trebuchet MS', sans-serif;
    font-size:13.5px;
    line-height:1.6;
    color:var(--cream);
    text-align:center;
  }

  .status b{ color:var(--plush); }

  .tasks{
    list-style:none;
    margin:22px 0 0;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:9px;
  }

  .tasks li{
    display:flex;
    align-items:center;
    gap:12px;
    font-family:'Trebuchet MS', sans-serif;
    font-size:13.5px;
    color:var(--plush-dim);
    padding:9px 12px;
    border-radius:12px;
    background:rgba(242,201,216,0.04);
    border:1px solid rgba(242,201,216,0.08);
    transition: all 0.2s ease;
  }

  .tasks li.done{
    color:var(--cream);
    background:rgba(255,180,105,0.08);
    border-color:rgba(255,180,105,0.25);
  }

  .box{
    flex:0 0 20px;
    width:20px;
    height:20px;
    border-radius:6px;
    border:1.5px solid var(--plush-dim);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:12px;
    color:var(--bg);
  }

  .tasks li.done .box{
    background:var(--amber);
    border-color:var(--amber);
    box-shadow:0 0 8px rgba(255,180,105,0.5);
  }

  .paws{
    display:flex;
    justify-content:center;
    gap:10px;
    margin-top:26px;
    font-size:20px;
    opacity:0.8;
  }

  @media (max-width:380px){
    .card{ padding:30px 20px 26px; border-radius:22px; }
    .seg{ height:22px; }
  }
</style>
</head>
<body>

  <div class="card">
    <h1>🤍 Христунька <span>ще трішки</span> 🤍</h1>

    <div class="meter-wrap">
      <div class="meter" id="meter"></div>
      <div class="meter-labels">
        <span>старт</span>
        <span>Урра ти вільна</span>
      </div>
    </div>

    <div class="count">
      <b id="filledCount">2</b><span class="of"> / 9 занять проведено</span>
    </div>

    <div class="status">
      Має бути ще <b id="remaining">7</b> занять — і ти вільна!!!!
    </div>

    <div class="paws">🤍 🧸 🤍 🧸 🤍</div>
  </div>

<script>
  const total = 9;
  const startHour = 9;
  const startMinute = 45;

  const meter = document.getElementById('meter');
  for(let i=0;i<total;i++){
    const seg = document.createElement('div');
    seg.className = 'seg';
    meter.appendChild(seg);
  }
  const segs = meter.querySelectorAll('.seg');

  function update(){
    const now = new Date();
    const nowMinutes = now.getHours() * 60 + now.getMinutes();
    const startMinutes = startHour * 60 + startMinute;

    let filled = Math.floor((nowMinutes - startMinutes) / 60) + 1;
    if (filled < 0) filled = 0;
    if (filled > total) filled = total;

    segs.forEach((seg, i) => {
      seg.classList.toggle('filled', i < filled);
    });

    document.getElementById('filledCount').textContent = filled;
    document.getElementById('remaining').textContent = Math.max(total - filled, 0);
  }

  update();
  setInterval(update, 60000);
</script>

</body>
</html>
